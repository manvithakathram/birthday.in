<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise 🎉</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  text-align:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
  color:yellowgreen;
}

/* ❤️ LOVE BACKGROUND */
.heart-bg{
  position:absolute;
  font-size:20px;
  animation:floatLove 6s linear infinite;
  opacity:0.7;
}

@keyframes floatLove{
  0%{transform:translateY(100vh); opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-10vh); opacity:0;}
}

/* center box */
.box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,0.15);
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(0,0,0,0.2);
  z-index:2;
}

/* photo */
img{
  width:130px;
  height:130px;
  border-radius:50%;
  border:4px solid black;
  box-shadow:0 0 20px black;
}

/* button */
button{
  padding:10px 18px;
  border:none;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

/* fireworks canvas */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:0;
}
</style>
</head>

<body>

<!-- 🎵 music -->
<audio id="music">
<source src="song.mp3" type="audio/mp3">
</audio>

<!-- 🎆 fireworks canvas -->
<canvas id="fireworks"></canvas>

<div class="box">

<h1>🎉 Happy Birthday 🎉</h1>
<h2>Dear Bava ❤️</h2>

<img src="bava.jpeg">

<p id="msg">Click the button for surprise 🎁</p>

<button onclick="start()">🎁 Open Surprise</button>

</div>

<script>

function start(){

  document.getElementById("music").play();

  let messages = [
    "💌 Happy Birthday Dear Bava 🎉",
    "🎂 Wishing you success & happiness",
    "✨ May all your dreams come true",
    "❤️ You are very special",
    "🎊 Enjoy your day",
    "💖 Stay blessed always"
  ];

  let i = 0;
  let msgBox = document.getElementById("msg");

  msgBox.innerHTML = "🎁 Loading wishes...";

  let show = setInterval(()=>{

    if(i < messages.length){
      msgBox.innerHTML = messages[i];
      i++;
    } else {
      clearInterval(show);
      msgBox.innerHTML = "🎉 HAPPY BIRTHDAY BAVA 🎉<br>💖 YOU ARE AMAZING 💖";
    }

  },2000);

  startFireworks();
}

/* 🎆 FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createExplosion(x,y){
  for(let i=0;i<70;i++){
    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-0.5)*8,
      vy:(Math.random()-0.5)*8,
      life:100
    });
  }
}

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach((p,i)=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    ctx.fillStyle="yellow";
    ctx.fillRect(p.x,p.y,3,3);

    if(p.life<=0){
      particles.splice(i,1);
    }
  });

  requestAnimationFrame(animate);
}

function startFireworks(){

  setInterval(()=>{
    createExplosion(
      Math.random()*canvas.width,
      Math.random()*canvas.height/2
    );
  },500);

  animate();
}

/* 🎈 balloons */
for(let i=0;i<12;i++){
  let b=document.createElement("div");
  b.innerHTML="🎈";
  b.style.position="absolute";
  b.style.left=Math.random()*100+"vw";
  b.style.bottom="-50px";
  b.style.fontSize="30px";
  b.style.animation="floatUp 7s linear infinite";
  document.body.appendChild(b);
}

/* ❤️ HEART BACKGROUND */
for(let i=0;i<30;i++){
  let h=document.createElement("div");
  h.classList.add("heart-bg");
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(Math.random()*5+4)+"s";
  document.body.appendChild(h);
}

/* balloon animation */
let style = document.createElement("style");
style.innerHTML = `
@keyframes floatUp{
  from{transform:translateY(100vh);}
  to{transform:translateY(-20vh);}
}`;
document.head.appendChild(style);

</script>

</body>
</html>
